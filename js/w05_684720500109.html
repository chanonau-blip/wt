<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดที่ 5 - Google Fonts & Icons</title>

    <!-- 1.1 ประยุกต์ใช้ CDN Google Fonts (ใช้ฟอนต์ Sarabun ภาษาไทย) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">

    <!-- 1.2 ประยุกต์ใช้ CDN Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center; /* จัดให้อยู่ตรงกลางแนวตั้งตามตัวอย่าง */
            padding-left: 20px;
        }

        /* 1.3 กล่องหลักฝั่งซ้าย */
        .sidebar-widget {
            display: flex;
            background-color: #e2e0f9; /* สีพื้นหลังม่วงอ่อน */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* แถบสีน้ำเงินด้านซ้าย + ตัวอักษรหมุนแนวตั้ง */
        .sidebar-title {
            background-color: #5555ff; /* สีน้ำเงิน/ม่วงเข้ม */
            color: #ffffff;
            padding: 20px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl; /* สั่งหมุนข้อความแนวตั้ง */
            transform: rotate(180deg);  /* หมุนกลับทิศให้อ่านจากบนลงล่าง */
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* โซนรายการไอคอนด้านขวา */
        .sidebar-icons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px 15px;
            align-items: center;
            justify-content: center;
        }

        .icon-item {
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-item:hover {
            transform: scale(1.15);
        }

        /* กำหนดสีไอคอนแต่ละตัวตามรูป */
        .fa-infinity {
            color: #0066ff;
        }

        .fa-line {
            color: #00c300;
        }

        .fa-instagram {
            color: #d62976;
        }

        .fa-whatsapp {
            color: #25d366;
        }

        .fa-x-twitter {
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- 1.3 จาก Fonts และ Icons เขียนหน้าเว็บดังรูป -->
    <div class="sidebar-widget">
        <!-- แถบสีน้ำเงินพร้อมข้อความแนวตั้ง -->
        <div class="sidebar-title">
            เทคโนโลยีคอมพิวเตอร์ มรม.
        </div>

        <!-- รายการไอคอน CDN -->
        <div class="sidebar-icons">
            <div class="icon-item"><i class="fa-solid fa-infinity"></i></div>
            <div class="icon-item"><i class="fa-brands fa-line"></i></div>
            <div class="icon-item"><i class="fa-brands fa-instagram"></i></div>
            <div class="icon-item"><i class="fa-brands fa-whatsapp"></i></div>
            <div class="icon-item"><i class="fa-brands fa-x-twitter"></i></div>
        </div>
    </div>

</body>
</html>
