<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type="range"] {
            width: 400px;
        }
    </style>
</head>
<body>
    <h1 id="ct">Hello, CT!</h1>
    <button onclick="changeText()">change text</button>
    <hr>
    <input oninput="changecolor()" type="color" name="c" id="c">
    <hr>
    <input oninput="mixcolor()" type="range" name="r" id="r" min="0" max="255" ><br><br>
    <input oninput="mixcolor()" type="range" name="g" id="g" min="0" max="255" ><br><br>
    <input oninput="mixcolor()" type="range" name="b" id="b" min="0" max="255" >
    <hr>
    <button id="btn">hide</button><br><br>
    <img src="https://picsum.photos/300/200?random=1" alt="Random Image">

    <script>
        let btn = document.querySelector("#btn");
        btn.addEventListener('click', function(){
            if (btn.innerHTML === "hide") {
                document.querySelector(#pic)
                btn.innerHTML = "show";
            } else {
                btn.innerHTML = "hide";
            }
        }


        function changeText() {
            let ct = document.getElementById("ct");
            if (ct.innerHTML === "Hello, CT!") {
                ct.innerHTML = "Hello, bye!";
            } else {
                ct.innerHTML = "Hello, CT!";
            }
        }
        function changecolor() {
            let c = document.getElementById("c");
            document.body.style.backgroundColor = c.value;
        }

        function mixcolor(){
            let r = document.getElementById("r").value;
            let g = document.getElementById("g").value;
            let b = document.getElementById("b").value;
            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }

    </script>
</body>
</html>
