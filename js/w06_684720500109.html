<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดที่ 6 - ข้อ 1.1 Nav Fastbootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet" aria-hidden="true">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 1. Sidebar ด้านซ้ายสุด */
        .sidebar {
            width: 60px;
            background-color: #3b506d; /* สีโทนน้ำเงินเข้มตามรูป */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .sidebar-icon {
            color: #a0b2c6;
            font-size: 1.3rem;
            margin-bottom: 20px;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar-icon:hover,
        .sidebar-icon.active {
            color: #ffffff;
        }

        /* Badge ตัวเลข 5 สีแดงบนไอคอนแชต */
        .badge-notify {
            position: absolute;
            top: -4px;
            right: -6px;
            background-color: #dc3545;
            color: white;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 50%;
        }

        /* 2. เมนูด้านบน (Tabs) */
        .top-nav {
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 20px;
        }

        .top-nav a {
            font-size: 0.8rem;
            color: #6c757d;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 500;
        }

        .top-nav a.active {
            color: #000000;
            font-weight: bold;
        }

        /* 3. รายชื่อเพื่อน */
        .chat-list-container {
            width: 320px;
            padding: 15px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .chat-item:hover {
            background-color: #f5f5f5;
        }

        .chat-item.active {
            background-color: #dcdcdc; /* แถบไฮไลต์สีเทาตามรูป */
        }

        .avatar-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
        }

        .chat-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #333333;
        }
    </style>
</head>
<body>
    <!-- Navbar Container -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2">
        <div class="container-fluid px-4">
            
            <!-- 1. Brand / Logo -->
            <a class="navbar-brand d-flex align-items-center fw-bold text-primary" href="#">
                <i class="bi bi-apple fs-4 me-2"></i>
                <span>CT Shopping</span>
            </a>

            <!-- Toggle Button สำหรับ Mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu items & Right side elements -->
            <div class="collapse navbar-collapse" id="navbarText">
                
                <!-- 2. Nav Links (ตรงกลาง) -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-3 text-center">
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-semibold fs-7" href="#">Category</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-semibold fs-7" href="#">Product</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-semibold fs-7" href="#">Order</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-semibold fs-7" href="#">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-semibold fs-7" href="#">About</a>
                    </li>
                </ul>

                <!-- 3. Search, Cart with Badge & Login Button (ฝั่งขวา) -->
                <div class="d-flex align-items-center justify-content-center gap-3">
                    
                    <!-- Search Input -->
                    <div class="input-group" style="width: 200px;">
                        <input type="text" class="form-control form-control-sm rounded-pill" placeholder="Search..." aria-label="Search">
                    </div>

                    <!-- Cart Icon with Badge -->
                    <div class="position-relative cursor-pointer">
                        <i class="bi bi-cart3 fs-5 text-dark"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger" style="font-size: 0.65rem;">
                            5
                        </span>
                    </div>

                    <!-- Login Button -->
                    <button class="btn btn-primary btn-sm px-3 rounded-2" type="button">Login</button>
                </div>

            </div>
        </div>
    </nav>

        <div class="d-flex h-100">

        <!-- ================= 1. Left Sidebar ================= -->
        <div class="sidebar">
            <div class="d-flex flex-column align-items-center">
                <div class="sidebar-icon">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="sidebar-icon active">
                    <i class="bi bi-chat-dots-fill"></i>
                    <span class="badge-notify">5</span>
                </div>
                <div class="sidebar-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
            </div>

            <div class="d-flex flex-column align-items-center">
                <div class="sidebar-icon">
                    <i class="bi bi-megaphone-fill"></i>
                </div>
                <div class="sidebar-icon mb-0">
                    <i class="bi bi-three-dots"></i>
                </div>
            </div>
        </div>

        <!-- ================= Main Content Area ================= -->
        <div class="flex-grow-1 d-flex flex-column">

            <!-- ================= 2. Top Navigation Tabs ================= -->
            <div class="top-nav">
                <a href="#" class="active">All</a>
                <a href="#">Friends</a>
                <a href="#">Groups</a>
                <a href="#">Official Accounts</a>
            </div>

            <!-- ================= 3. Chat List Area ================= -->
            <div class="chat-list-container">
                
                <!-- Search Box -->
                <div class="mb-3">
                    <input type="text" class="form-control form-control-sm text-secondary" placeholder="Search" style="font-size: 0.8rem;">
                </div>

                <!-- User Item 1 -->
                <div class="chat-item">
                    <img src="https://picsum.photos/100/100?random=1" class="avatar-img" alt="John Doe">
                    <span class="chat-name">John Doe</span>
                </div>

                <!-- User Item 2 -->
                <div class="chat-item">
                    <img src="https://picsum.photos/100/100?random=2" class="avatar-img" alt="Janny">
                    <span class="chat-name">Janny</span>
                </div>

                <!-- User Item 3 (Selected - Jack Dawson) -->
                <div class="chat-item active">
                    <img src="https://picsum.photos/100/100?random=3" class="avatar-img" alt="Jack Dawson">
                    <span class="chat-name">Jack Dawson</span>
                </div>

                <!-- User Item 4 -->
                <div class="chat-item">
                    <img src="https://picsum.photos/100/100?random=4" class="avatar-img" alt="Janet Jackson">
                    <span class="chat-name">Janet Jackson</span>
                </div>

                <!-- User Item 5 -->
                <div class="chat-item">
                    <img src="https://picsum.photos/100/100?random=5" class="avatar-img" alt="Jane Johnson">
                    <span class="chat-name">Jane Johnson</span>
                </div>

                <!-- User Item 6 -->
                <div class="chat-item">
                    <img src="https://picsum.photos/100/100?random=6" class="avatar-img" alt="Jone Junior">
                    <span class="chat-name">Jone Junior</span>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/js/fastbootstrap.min.js"></script>
</body>
</html>
